<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#155b75">
<title>محرّك المخطط — نموذج التطبيق القابل للتوسّع</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="محرّك المخطط">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf8f2; --paper-2:#f3efe4; --sand:#e9dfc8;
  --lake:#247ba0; --lake-deep:#155b75; --green:#4d7c5a; --field:#dce8d7;
  --ink:#243238; --muted:#66736f; --clay:#b46f4b;
  --line:#ded6c5; --white:#ffffffd6; --white-solid:#ffffff;
  --amber:#c58a2f; --danger:#b8503f; --danger-bg:#f6e7e3;
  --shadow:0 10px 30px #4d432c14, 0 2px 4px #4d432c0d;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper);-webkit-text-size-adjust:100%;overflow-x:hidden}
body{color:var(--ink);background:var(--paper);
  font-family:"IBM Plex Sans Arabic","Noto Kufi Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased}
button{cursor:pointer;color:inherit;font:inherit}
h1,h2,h3{letter-spacing:-.3px}
::selection{background:#247ba033}

.app-shell{background:
    radial-gradient(circle at 8% 0%, #247ba014, transparent 28%),
    linear-gradient(#ffffff70,#ffffff70),
    repeating-linear-gradient(120deg, transparent 0 72px, #b46f4b06 73px 74px),
    var(--paper);
  grid-template-columns:1fr 248px;min-height:100vh;display:grid}
@media(max-width:820px){.app-shell{grid-template-columns:1fr}.side-nav{display:none!important}}
.side-nav{border-left:1px solid var(--line);z-index:50;backdrop-filter:blur(18px);
  background:rgba(249,247,239,.94);flex-direction:column;grid-area:1/2;height:100vh;
  padding:22px 16px;display:flex;position:sticky;top:0}
.brand-mark{grid-template-rows:36px 20px;grid-template-columns:46px 1fr;align-items:center;
  height:78px;margin-bottom:16px;padding:8px 12px;display:grid}
.brand-mark>span{color:#fff;background:linear-gradient(145deg,var(--lake),var(--green));
  border-radius:13px 13px 13px 4px;grid-row:1/3;place-items:center;width:42px;height:42px;
  font-size:23px;font-weight:800;display:grid}
.brand-mark b{align-self:end;margin-right:10px;font-size:19px;color:var(--ink)}
.brand-mark small{letter-spacing:1.6px;color:var(--lake);align-self:start;margin-right:10px;font-size:8px}
.side-nav nav{flex-direction:column;gap:4px;display:flex;overflow-y:auto;margin:0 -6px;padding:0 6px}
.side-nav nav button{color:#59645f;text-align:right;background:none;border:0;border-radius:12px;
  align-items:center;gap:11px;width:100%;min-height:44px;padding:8px 12px;font-size:12.5px;
  font-weight:600;transition:.18s;display:flex}
.side-nav nav button:hover{background:#f0ece0;transform:translateX(-2px)}
.side-nav nav button.active{color:var(--lake-deep);box-shadow:inset -3px 0 var(--lake);background:#e6f0ed}
.nav-icon{opacity:.92;border:1px solid currentColor;border-radius:8px;place-items:center;
  width:26px;height:26px;font-size:15px;display:grid;flex:0 0 auto}
.nav-num{margin-right:auto;font-family:var(--mono);font-size:9px;opacity:.5}
.nav-sep{border-top:1px dashed var(--line);margin:10px 4px 6px}
.nav-foot{border-top:1px solid var(--line);color:var(--muted);grid-template-columns:10px 1fr;
  align-items:center;gap:4px 7px;margin-top:12px;padding:14px 8px 2px;font-size:10.5px;display:grid}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--green)}.dot.err{background:var(--danger)}.dot.busy{background:var(--amber)}

.main{grid-area:1/1;min-width:0;display:flex;flex-direction:column}
.topbar{border-bottom:1px solid var(--line);z-index:30;backdrop-filter:blur(16px);
  background:rgba(250,248,242,.8);justify-content:space-between;align-items:center;
  gap:10px;min-height:92px;padding:16px 30px;display:flex;position:sticky;top:0}
.topbar .eyebrow{color:var(--lake);letter-spacing:.4px;margin-bottom:5px;font-size:9px;font-weight:800;display:block}
.topbar h1{font-size:19px;font-weight:700;color:var(--ink)}
.content{padding:24px 30px;max-width:1180px;width:100%}
@media(max-width:820px){.topbar,.content{padding-inline:16px}.topbar h1{font-size:16px}}
.mobile-nav{display:none;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);
  background:rgba(250,248,242,.9);position:sticky;top:92px;z-index:29}
.mobile-nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 13px;font-size:11px;font-weight:600;color:#4c5854}
.mobile-nav button.active{background:#e6f0ed;color:var(--lake-deep);border-color:var(--lake)}
@media(max-width:820px){.mobile-nav{display:flex}}

.grid{display:grid;gap:16px}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.grid.g4{grid-template-columns:repeat(2,1fr)}.grid.g3,.grid.g2{grid-template-columns:1fr}}
.kpi-card{background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow);
  border-radius:14px;padding:15px;display:flex;gap:12px;align-items:flex-start}
.kpi-icon{width:43px;height:43px;color:var(--lake-deep);background:#e8f0f1;border:1px solid #c8d9d9;
  border-radius:13px;place-items:center;font-size:20px;display:grid;flex:0 0 auto}
.kpi-card.green .kpi-icon{color:var(--green);background:#edf4e8;border-color:#c8d9bd}
.kpi-card.sand .kpi-icon{color:var(--clay);background:#f5eee1;border-color:#e3d3bd}
.kpi-body{min-width:0}
.kpi-body .lbl{font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
.kpi-body .big{font-size:24px;font-weight:700;font-family:var(--mono);color:var(--ink);line-height:1.1;
  font-variant-numeric:tabular-nums;word-break:break-all}
.kpi-body .big .unit{font-size:11px;font-weight:500;color:var(--muted);margin-right:3px;font-family:inherit}
.kpi-body .sub{font-size:9.5px;color:var(--muted);margin-top:4px}

.panel{background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow);
  border-radius:16px;padding:20px;margin-top:16px}
.panel h2{font-size:15px;font-weight:700;margin-bottom:4px}
.eyebrow{color:var(--lake);letter-spacing:.4px;margin-bottom:5px;font-size:9px;font-weight:800;display:block}
.hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.7}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 15px;font-size:11px;
  font-weight:600;color:#4c5854;transition:.15s;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn:hover{border-color:var(--lake);color:var(--lake-deep)}
.btn.solid{background:linear-gradient(135deg,var(--lake),var(--lake-deep));color:#fff;border:0;
  box-shadow:0 6px 14px #247ba026}
.btn.warn{color:var(--danger);border-color:#e6c9c2}
.btn.mini{padding:5px 10px;font-size:10px;border-radius:8px}
.pill{font-size:9px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block}
.pill.green{background:#edf4e8;color:var(--green)}
.pill.sand{background:#f5eee1;color:var(--clay)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.pill.lake{background:#e8f0f1;color:var(--lake-deep)}
/* ============ التقرير والطباعة ============ */
.report-root{display:none}
@media screen{ body.printing .app-shell{display:none} body.printing .report-root{display:block;padding:18px;background:#fff} }
.rep-head{text-align:center;border-bottom:2.5px solid var(--lake-deep);padding-bottom:12px;margin-bottom:18px}
.rep-org{font-size:13px;font-weight:700;color:var(--lake-deep)}
.rep-dept{font-size:11px;color:#333;margin-top:3px}
.rep-head h1{font-size:17px;margin-top:12px;color:#0e3b5c}
.rep-meta{font-size:9.5px;color:#555;margin-top:7px;font-family:var(--mono)}
.rep-block{margin-bottom:20px;page-break-inside:auto}
.rep-block>h2{font-size:13.5px;color:#0e3b5c;border-right:4px solid var(--lake);padding-right:9px;margin-bottom:5px}
.rep-src{font-size:9.5px;color:#555;margin-bottom:9px;font-family:var(--mono)}
.rep-sec h3{font-size:11.5px;color:#0e3b5c;margin:13px 0 5px}
.rep-tbl{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:8px}
.rep-tbl th{background:#0e3b5c;color:#fff;border:1.2px solid #0e3b5c;padding:6px;text-align:right;font-size:9.5px}
.rep-tbl td{border:1.2px solid #9bb0c0;padding:5px 6px;font-variant-numeric:tabular-nums}
.rep-note{font-size:9.5px;color:#444;margin:5px 0 10px;line-height:1.8}
.rep-chart{border:1px solid #9bb0c0;padding:7px;margin-bottom:9px;page-break-inside:avoid}
.rep-sign{margin-top:26px;page-break-inside:avoid}
.rep-sign td{height:52px;vertical-align:top;font-size:10px}
.rep-foot{margin-top:14px;font-size:8.5px;color:#666;text-align:center;border-top:1px solid #ccc;padding-top:7px}
@media print{
  @page{size:A4;margin:14mm}
  .app-shell,.toast{display:none!important}
  .report-root{display:block!important}
  body{background:#fff}
  .rep-block{page-break-inside:auto}
  .rep-tbl{page-break-inside:auto}
  .rep-tbl tr{page-break-inside:avoid}
}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:10.5px;
  font-weight:700;color:#4c5854;transition:.15s}
.chip:hover{border-color:var(--lake)}
.chip.on{background:#e6f0ed;color:var(--lake-deep);border-color:var(--lake)}
.grp-title{font-size:10px;font-weight:800;color:var(--lake);letter-spacing:.4px;margin:16px 0 4px;
  border-bottom:1px dashed var(--line);padding-bottom:5px}
.wiz-bar{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--muted);font-weight:700;
  border-bottom:1px dashed var(--line);padding-bottom:9px;margin-bottom:12px}
.wiz-bar .sp{margin-inline-start:auto}
.wiz-bar .m{font-family:var(--mono)}
.wiz-q{font-size:15px!important;margin:4px 0 14px!important}
.wiz-opts{display:grid;gap:9px}
.wiz-opt{text-align:right;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 15px;
  font-size:12.5px;font-weight:600;color:#40504b;transition:.15s;min-height:48px}
.wiz-opt:hover{border-color:var(--lake);background:#f2f7f6;transform:translateX(-2px)}
.wiz-opt.on{border-color:var(--lake);background:#e6f0ed;color:var(--lake-deep)}
.ov-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;
  box-shadow:var(--shadow);cursor:pointer;transition:.18s}
.ov-card:hover{border-color:var(--lake);transform:translateY(-2px)}
.ov-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.ov-head .t{font-size:12.5px;font-weight:700}
.ov-big{font-family:var(--mono);font-size:27px;font-weight:700;color:var(--lake-deep);line-height:1.1;
  font-variant-numeric:tabular-nums;word-break:break-all}
.ov-big .unit{font-size:11px;color:var(--muted);margin-right:4px;font-family:inherit;font-weight:500}
.ov-sub{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:600}
.ov-foot{font-size:9.5px;color:var(--muted);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-family:var(--mono)}
.errbox{margin-top:12px;background:var(--danger-bg);border:1px solid #e6c9c2;border-radius:10px;
  padding:10px 14px;font-size:11px;color:var(--danger);line-height:1.9}
.fld small.rule{font-size:9px;color:var(--clay);font-family:var(--mono)}
.fld input.bad,.fld select.bad{border-color:var(--danger);background:#fdf6f4}
.ops{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--white);border:1px solid var(--line);
  border-radius:12px;padding:10px 16px;margin-bottom:16px;font-size:11px;color:var(--muted);box-shadow:var(--shadow)}
.ops b{font-family:var(--mono);font-size:14px;color:var(--ink);font-weight:700;margin-inline-end:3px}
.ops .sp{margin-inline-start:auto}
.ops .m{font-family:var(--mono);font-size:10px}
input.search{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px;
  font-size:12px;font-family:inherit;color:var(--ink);width:100%}
input.search:focus{outline:2px solid #247ba033;border-color:var(--lake)}
.banner.warn{background:var(--danger-bg);border-color:#e6c9c2;color:var(--danger)}
.banner{display:flex;align-items:center;gap:10px;background:#e8f0f1;border:1px solid #c8d9d9;
  border-radius:12px;padding:10px 14px;font-size:11px;color:var(--lake-deep);margin-bottom:4px}

.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:10px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:10px;background:#fff;
  padding:9px 11px;font-size:12px;font-family:inherit;color:var(--ink);width:100%}
.fld input:focus,.fld select:focus{outline:2px solid #247ba033;border-color:var(--lake)}
.fld input[type=number]{font-family:var(--mono)}

.tbl-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;margin-top:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:11.5px;min-width:420px}
th{background:var(--paper-2);color:var(--muted);font-size:10px;font-weight:700;text-align:right;
  padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #eee7d8;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:11px}
.chart-box{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.map-box{margin-top:12px;height:320px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#eee}

.adm-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);
  border-radius:12px;background:#fff;margin-top:8px;flex-wrap:wrap}
.adm-row .t{font-size:12.5px;font-weight:700}
.adm-row .m{font-size:10px;color:var(--muted);font-family:var(--mono)}
.adm-row .sp{margin-right:auto}
.sub-panel{border:1px dashed var(--line);border-radius:12px;padding:14px;margin-top:12px;background:#fffdf8}
.sub-panel h3{font-size:12px;font-weight:700;margin-bottom:2px}
.toast{position:fixed;inset-inline:0;bottom:18px;margin-inline:auto;width:max-content;max-width:90vw;
  background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;padding:11px 18px;border-radius:999px;
  box-shadow:0 10px 26px #0003;opacity:0;transform:translateY(10px);transition:.22s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateY(0)}
.toast.bad{background:var(--danger)}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="side-nav">
    <div class="brand-mark">
      <span>◱</span>
      <b>محرّك المخطط</b>
      <small>نموذج قابل للتوسّع</small>
    </div>
    <nav id="nav"></nav>
    <div class="nav-foot">
      <span class="dot" id="st-dot"></span>
      <span id="st-txt">جارٍ الاتصال…</span>
      <small id="st-ver" style="grid-column:1/3;font-family:var(--mono)">—</small>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div>
        <span class="eyebrow" id="tb-eyebrow">—</span>
        <h1 id="tb-title">—</h1>
      </div>
      <div class="actions" style="margin-top:0">
        <button class="btn" id="btn-refresh">↻ تحديث</button>
      </div>
    </header>
    <div class="mobile-nav" id="mnav"></div>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div id="report-root" class="report-root"></div>

<script>
/*!
 * MWRI Hydraulics Core - v1.0
 * النواة الحسابية الهيدروليكية الموحّدة لتطبيقات م. محسن
 * SI units only: m, m/s, m3/s, s.  g = 9.81 m/s2
 * قيد إلزامى: لا backticks ولا template literals فى هذا الملف إطلاقاً.
 * الاستخدام: &lt;script src="hydraulics.js">&lt;/script> ثم MWRIHyd.normalDepth(...)
 */
(function (root) {
  "use strict";

  var G = 9.81;
  var EPS = 1e-9;

  function num(v, name) {
    if (typeof v !== "number" || !isFinite(v)) {
      throw new Error("MWRIHyd: قيمة غير صالحة للمتغير " + (name || "?"));
    }
    return v;
  }

  /* ==========================================================
   * 1) هندسة المقاطع
   * ========================================================== */

  /* مقطع شبه منحرف: b قاع، y عمق، z ميل الجوانب (أفقى:رأسى) */
  function trapArea(b, y, z) { return (b + z * y) * y; }
  function trapPerimeter(b, y, z) { return b + 2 * y * Math.sqrt(1 + z * z); }
  function trapTopWidth(b, y, z) { return b + 2 * z * y; }

  function trapSection(b, y, z) {
    num(b, "b"); num(y, "y"); num(z, "z");
    if (y <= 0) return { A: 0, P: b, T: b, R: 0, D: 0, y: y };
    var A = trapArea(b, y, z);
    var P = trapPerimeter(b, y, z);
    var T = trapTopWidth(b, y, z);
    return { A: A, P: P, T: T, R: A / P, D: A / T, y: y };
  }

  /* مقطع طبيعى غير منتظم من نقاط مرفوعة {x, z} — z منسوب القاع
     يرجع A و P و T عند منسوب سطح ماء wl */
  function irregularSection(points, wl) {
    if (!points || points.length < 2) throw new Error("MWRIHyd: نقاط المقطع أقل من نقطتين");
    var A = 0, P = 0, T = 0;
    for (var i = 0; i < points.length - 1; i++) {
      var x1 = points[i].x, z1 = points[i].z;
      var x2 = points[i + 1].x, z2 = points[i + 1].z;
      var d1 = wl - z1, d2 = wl - z2;
      if (d1 <= 0 && d2 <= 0) continue;
      var xa = x1, xb = x2, da = d1, db = d2;
      if (d1 < 0) { /* تقاطع سطح الماء على اليسار */
        xa = x1 + (x2 - x1) * (0 - d1) / (d2 - d1); da = 0;
      }
      if (d2 < 0) { /* تقاطع على اليمين */
        xb = x1 + (x2 - x1) * (0 - d1) / (d2 - d1); db = 0;
      }
      var w = xb - xa;
      if (w <= 0) continue;
      A += 0.5 * (da + db) * w;
      P += Math.sqrt(w * w + (da - db) * (da - db));
      T += w;
    }
    return { A: A, P: P, T: T, R: P > 0 ? A / P : 0, D: T > 0 ? A / T : 0, wl: wl };
  }

  /* ==========================================================
   * 2) مانينج والتصرف
   * ========================================================== */

  /* Q = (1/n) * A * R^(2/3) * S^(1/2)   — مانينج SI */
  function manningQ(n, A, R, S) {
    num(n, "n"); num(A, "A"); num(R, "R"); num(S, "S");
    if (n <= 0) throw new Error("MWRIHyd: معامل الخشونة n يجب أن يكون موجباً");
    if (S < 0) throw new Error("MWRIHyd: الميل S سالب — استخدم GVF للميول العكسية");
    return (1 / n) * A * Math.pow(R, 2 / 3) * Math.sqrt(S);
  }

  function manningV(n, R, S) {
    return (1 / n) * Math.pow(R, 2 / 3) * Math.sqrt(S);
  }

  /* الاستنتاج العكسى: معامل الخشونة من قياس حقلى */
  function manningN(Q, A, R, S) {
    if (Q <= 0) throw new Error("MWRIHyd: التصرف المقاس يجب أن يكون موجباً");
    return (A * Math.pow(R, 2 / 3) * Math.sqrt(S)) / Q;
  }

  /* التصرّفية K = (1/n) A R^(2/3) */
  function conveyance(n, A, R) { return (1 / n) * A * Math.pow(R, 2 / 3); }

  /* ==========================================================
   * 3) العمق الطبيعى والحرج (bisection — لا يفشل مثل نيوتن)
   * ========================================================== */

  function bisect(f, lo, hi, tol, maxIter) {
    tol = tol || 1e-7;
    maxIter = maxIter || 200;
    var flo = f(lo), fhi = f(hi);
    if (flo * fhi > 0) {
      /* توسيع المدى مرة واحدة قبل الاستسلام */
      var k = 0;
      while (flo * fhi > 0 && k < 40) { hi = hi * 2; fhi = f(hi); k++; }
      if (flo * fhi > 0) return NaN;
    }
    var mid = lo;
    for (var i = 0; i < maxIter; i++) {
      mid = 0.5 * (lo + hi);
      var fm = f(mid);
      if (Math.abs(fm) < EPS || (hi - lo) < tol) return mid;
      if (flo * fm < 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
    }
    return mid;
  }

  /* العمق الطبيعى yn لمقطع شبه منحرف */
  function normalDepth(Q, b, z, n, S) {
    num(Q, "Q");
    if (S <= 0) throw new Error("MWRIHyd: العمق الطبيعى غير معرّف لميل صفر أو عكسى");
    var f = function (y) {
      var s = trapSection(b, y, z);
      return manningQ(n, s.A, s.R, S) - Q;
    };
    return bisect(f, 1e-6, Math.max(10, Q));
  }

  /* العمق الحرج yc: Q^2 * T / (g * A^3) = 1 */
  function criticalDepth(Q, b, z) {
    var f = function (y) {
      var s = trapSection(b, y, z);
      return (Q * Q * s.T) / (G * s.A * s.A * s.A) - 1;
    };
    return bisect(f, 1e-6, Math.max(10, Q));
  }

  function froude(Q, A, T) {
    if (A <= 0 || T <= 0) return 0;
    return Q / (A * Math.sqrt(G * (A / T)));
  }

  /* الطاقة النوعية E = y + V^2/2g */
  function specificEnergy(Q, A, y) {
    var V = Q / A;
    return y + (V * V) / (2 * G);
  }

  /* ==========================================================
   * 4) السريان المتغيّر التدريجى GVF بطريقة رونج-كوتا الرابعة
   * dy/dx = (S0 - Sf) / (1 - Fr^2)
   * الاتجاه: للسريان تحت الحرج نتكامل عكس اتجاه السريان (من المصب للمنبع)
   * ========================================================== */

  function gvfSlope(y, Q, b, z, n, S0) {
    var s = trapSection(b, y, z);
    if (s.A <= 0) return 0;
    var Sf = Math.pow((Q * n) / (s.A * Math.pow(s.R, 2 / 3)), 2);
    var Fr2 = (Q * Q * s.T) / (G * s.A * s.A * s.A);
    var den = 1 - Fr2;
    if (Math.abs(den) < 1e-6) den = den < 0 ? -1e-6 : 1e-6; /* حماية عند الحرج */
    return (S0 - Sf) / den;
  }

  /* opts: {Q, b, z, n, S0, yStart, length, dx, direction}
     direction: "upstream" (افتراضى، تحت حرج) أو "downstream" (فوق حرج)
     يرجع مصفوفة نقاط {x, y, wl, V, Fr, Sf} — x تتزايد باتجاه التكامل */
  function gvfProfile(opts) {
    var Q = num(opts.Q, "Q"), b = opts.b, z = opts.z, n = opts.n, S0 = opts.S0;
    var y = num(opts.yStart, "yStart");
    var L = num(opts.length, "length");
    var dx = opts.dx || Math.max(1, L / 200);
    var dir = opts.direction === "downstream" ? 1 : -1; /* -1 = نتحرك للمنبع */
    var zBed = typeof opts.bedLevelStart === "number" ? opts.bedLevelStart : 0;
    var out = [];
    var x = 0;
    var steps = Math.ceil(L / dx);
    for (var i = 0; i <= steps; i++) {
      var s = trapSection(b, y, z);
      var V = s.A > 0 ? Q / s.A : 0;
      var Sf = Math.pow((Q * n) / (s.A * Math.pow(s.R, 2 / 3)), 2);
      out.push({
        x: x,
        y: y,
        bed: 0,
        wl: 0,
        V: V,
        Fr: froude(Q, s.A, s.T),
        Sf: Sf
      });
      if (i === steps) break;
      /* RK4 على المسافة h = dir*dx */
      var h = dir * dx;
      var k1 = gvfSlope(y, Q, b, z, n, S0);
      var k2 = gvfSlope(Math.max(1e-4, y + 0.5 * h * k1), Q, b, z, n, S0);
      var k3 = gvfSlope(Math.max(1e-4, y + 0.5 * h * k2), Q, b, z, n, S0);
      var k4 = gvfSlope(Math.max(1e-4, y + h * k3), Q, b, z, n, S0);
      y = y + (h / 6) * (k1 + 2 * k2 + 2 * k3 + k4);
      if (!isFinite(y) || y <= 1e-4) { y = 1e-4; }
      x += dx;
    }
    /* تصحيح عمود bed: يُحسب صراحةً بدل التعبير المركّب أعلاه */
    for (var j = 0; j < out.length; j++) {
      out[j].bed = zBed + (dir === -1 ? S0 * out[j].x : -S0 * out[j].x);
      out[j].wl = out[j].bed + out[j].y;
    }
    return out;
  }

  /* تصنيف منحنى الارتداد: M1/M2/M3/S1/S2/S3/C/H/A */
  function backwaterClass(y, yn, yc, S0) {
    var slopeType;
    if (S0 <= 0) slopeType = S0 === 0 ? "H" : "A";
    else if (Math.abs(yn - yc) / Math.max(yc, 1e-6) < 0.01) slopeType = "C";
    else slopeType = yn > yc ? "M" : "S";
    var hi = Math.max(yn, yc), lo = Math.min(yn, yc);
    var zone = y > hi ? 1 : (y > lo ? 2 : 3);
    return slopeType + zone;
  }

  /* ==========================================================
   * 5) البوابات
   * a = فتحة البوابة، y1 = العمق أمام البوابة، y3 = العمق خلفها
   * Cc = معامل الانكماش (0.61 افتراضياً لبوابة رأسية حادة)
   * ========================================================== */

  function gateFlow(opts) {
    var b = num(opts.b, "b"), a = num(opts.a, "a"), y1 = num(opts.y1, "y1");
    var y3 = typeof opts.y3 === "number" ? opts.y3 : 0;
    var Cc = typeof opts.Cc === "number" ? opts.Cc : 0.61;
    if (a <= 0 || y1 <= a) return { Q: 0, mode: "مغلقة أو غارقة كلياً", Cd: 0 };
    var y2 = Cc * a; /* عمق vena contracta */
    /* حد الغمر: العمق المتعاقب لـ y2 */
    var submerged = y3 > y2 * 1.0 && y3 > 0;
    var Cd, Q, mode;
    if (!submerged) {
      /* سريان حر — صيغة الطاقة الدقيقة */
      Cd = Cc / Math.sqrt(1 + (Cc * a) / y1);
      Q = Cd * b * a * Math.sqrt(2 * G * y1);
      mode = "حر";
    } else {
      var dh = y1 - y3;
      if (dh <= 0) return { Q: 0, mode: "لا فرق منسوب", Cd: 0 };
      Cd = Cc / Math.sqrt(1 + (Cc * a) / y1);
      Q = Cd * b * a * Math.sqrt(2 * G * dh);
      mode = "مغمور";
    }
    return { Q: Q, Cd: Cd, y2: y2, mode: mode };
  }

  /* فتحة البوابة المطلوبة لتمرير تصرف مستهدف (سريان حر) */
  function gateOpeningFor(Qtarget, b, y1, Cc) {
    Cc = Cc || 0.61;
    var f = function (a) {
      return gateFlow({ b: b, a: a, y1: y1, Cc: Cc }).Q - Qtarget;
    };
    return bisect(f, 1e-4, Math.max(0.01, y1 * 0.99));
  }

  /* ==========================================================
   * 6) الهدارات
   * ========================================================== */

  /* هدار حاد الحافة مستطيل — ريبوك Rehbock: H الشحنة، P ارتفاع الهدار */
  function sharpCrestedWeir(b, H, P) {
    if (H <= 0) return 0;
    var Ce = 0.611 + 0.075 * (H / Math.max(P, 1e-6));
    var He = H + 0.0011;
    return (2 / 3) * Ce * b * Math.sqrt(2 * G) * Math.pow(He, 1.5);
  }

  /* هدار عريض القمة */
  function broadCrestedWeir(b, H, Cd) {
    if (H <= 0) return 0;
    Cd = typeof Cd === "number" ? Cd : 0.85;
    return Cd * b * Math.sqrt(G) * Math.pow((2 / 3) * H, 1.5);
  }

  /* هدار مثلث V-notch بزاوية theta بالدرجات (90 افتراضى) */
  function vNotchWeir(H, thetaDeg, Cd) {
    if (H <= 0) return 0;
    thetaDeg = thetaDeg || 90;
    Cd = typeof Cd === "number" ? Cd : 0.58;
    var t = (thetaDeg * Math.PI) / 180;
    return (8 / 15) * Cd * Math.sqrt(2 * G) * Math.tan(t / 2) * Math.pow(H, 2.5);
  }

  /* ==========================================================
   * 7) القفزة الهيدروليكية
   * ========================================================== */

  function hydraulicJump(y1, Q, b) {
    var A1 = b * y1;
    var V1 = Q / A1;
    var Fr1 = V1 / Math.sqrt(G * y1);
    if (Fr1 <= 1) return { Fr1: Fr1, y2: y1, dE: 0, note: "لا توجد قفزة (السريان تحت حرج)" };
    var y2 = 0.5 * y1 * (Math.sqrt(1 + 8 * Fr1 * Fr1) - 1);
    var dE = Math.pow(y2 - y1, 3) / (4 * y1 * y2);
    var type;
    if (Fr1 < 1.7) type = "متموجة";
    else if (Fr1 < 2.5) type = "ضعيفة";
    else if (Fr1 < 4.5) type = "متذبذبة";
    else if (Fr1 < 9) type = "ثابتة (مثالية للحوض)";
    else type = "قوية";
    return { Fr1: Fr1, y2: y2, dE: dE, Lj: 6 * y2, type: type };
  }

  /* ==========================================================
   * 8) منحنى التصريف Rating Curve:  Q = C (h - h0)^m
   * الملاءمة بالمربعات الصغرى على المقياس اللوغاريتمى مع بحث عن h0
   * data: [{h, Q}, ...]
   * ========================================================== */

  function fitRatingCurve(data, h0Range) {
    if (!data || data.length < 3) throw new Error("MWRIHyd: منحنى التصريف يحتاج 3 قياسات على الأقل");
    var hMin = Infinity;
    for (var i = 0; i < data.length; i++) { if (data[i].h < hMin) hMin = data[i].h; }
    var lo = h0Range ? h0Range[0] : hMin - 5;
    var hi = h0Range ? h0Range[1] : hMin - 0.001;
    var best = null;
    var steps = 400;
    for (var k = 0; k <= steps; k++) {
      var h0 = lo + ((hi - lo) * k) / steps;
      var sx = 0, sy = 0, sxx = 0, sxy = 0, nPts = 0;
      var ok = true;
      for (var j = 0; j < data.length; j++) {
        var dh = data[j].h - h0;
        if (dh <= 0 || data[j].Q <= 0) { ok = false; break; }
        var X = Math.log(dh), Y = Math.log(data[j].Q);
        sx += X; sy += Y; sxx += X * X; sxy += X * Y; nPts++;
      }
      if (!ok || nPts < 3) continue;
      var den = nPts * sxx - sx * sx;
      if (Math.abs(den) < EPS) continue;
      var m = (nPts * sxy - sx * sy) / den;
      var lnC = (sy - m * sx) / nPts;
      var C = Math.exp(lnC);
      /* R2 على القيم الحقيقية لا اللوغاريتمية */
      var ssRes = 0, ssTot = 0, mean = 0;
      for (var t = 0; t < data.length; t++) { mean += data[t].Q; }
      mean /= data.length;
      for (var t2 = 0; t2 < data.length; t2++) {
        var pred = C * Math.pow(data[t2].h - h0, m);
        ssRes += Math.pow(data[t2].Q - pred, 2);
        ssTot += Math.pow(data[t2].Q - mean, 2);
      }
      var R2 = ssTot > 0 ? 1 - ssRes / ssTot : 0;
      if (!best || R2 > best.R2) best = { C: C, m: m, h0: h0, R2: R2, rmse: Math.sqrt(ssRes / data.length) };
    }
    if (!best) throw new Error("MWRIHyd: تعذّرت ملاءمة منحنى التصريف — راجع البيانات");
    return best;
  }

  function ratingQ(fit, h) {
    if (h <= fit.h0) return 0;
    return fit.C * Math.pow(h - fit.h0, fit.m);
  }

  /* ==========================================================
   * 9) الاتزان المائى
   * inflows/outflows: مصفوفات {name, Q}
   * ========================================================== */

  function waterBalance(inflows, outflows, opts) {
    opts = opts || {};
    var sumIn = 0, sumOut = 0, i;
    for (i = 0; i < (inflows || []).length; i++) sumIn += inflows[i].Q || 0;
    for (i = 0; i < (outflows || []).length; i++) sumOut += outflows[i].Q || 0;
    var seepage = opts.seepage || 0;
    var evap = opts.evaporation || 0;
    var closure = sumIn - sumOut - seepage - evap;
    var pct = sumIn > 0 ? (closure / sumIn) * 100 : 0;
    var tol = typeof opts.tolerancePct === "number" ? opts.tolerancePct : 5;
    return {
      inflow: sumIn,
      outflow: sumOut,
      seepage: seepage,
      evaporation: evap,
      closure: closure,
      closurePct: pct,
      status: Math.abs(pct) <= tol ? "مقبول" : (closure > 0 ? "فاقد غير مفسّر" : "عجز — راجع القياسات"),
      tolerancePct: tol
    };
  }

  /* ==========================================================
   * 10) تتبّع الموجة — Muskingum
   * inflow: مصفوفة تصرفات، dt بالثوانى، K بالثوانى، x بين 0 و0.5
   * ========================================================== */

  function muskingum(inflow, K, x, dt, Q0) {
    var den = 2 * K * (1 - x) + dt;
    var C0 = (dt - 2 * K * x) / den;
    var C1 = (dt + 2 * K * x) / den;
    var C2 = (2 * K * (1 - x) - dt) / den;
    var out = [typeof Q0 === "number" ? Q0 : inflow[0]];
    for (var i = 1; i < inflow.length; i++) {
      out.push(C0 * inflow[i] + C1 * inflow[i - 1] + C2 * out[i - 1]);
    }
    return { outflow: out, C0: C0, C1: C1, C2: C2, stable: (dt >= 2 * K * x && dt <= 2 * K * (1 - x)) };
  }

  /* ==========================================================
   * 11) فحوص المعقولية — تُستدعى قبل عرض أى رقم للمستخدم
   * ========================================================== */

  function sanityCheck(res) {
    var flags = [];
    if (typeof res.V === "number") {
      if (res.V > 2.0) flags.push({ level: "خطر", msg: "سرعة " + res.V.toFixed(2) + " م/ث تتجاوز حد النحر لترعة ترابية (2.0)" });
      else if (res.V < 0.3 && res.V > 0) flags.push({ level: "تنبيه", msg: "سرعة " + res.V.toFixed(2) + " م/ث أقل من حد الترسيب (0.3)" });
    }
    if (typeof res.Fr === "number" && res.Fr > 0.9 && res.Fr < 1.1) {
      flags.push({ level: "تنبيه", msg: "السريان قرب الحرج (Fr=" + res.Fr.toFixed(2) + ") — النتائج غير مستقرة عددياً" });
    }
    if (typeof res.n === "number" && (res.n < 0.012 || res.n > 0.075)) {
      flags.push({ level: "خطر", msg: "معامل خشونة n=" + res.n.toFixed(3) + " خارج المدى الواقعى (0.012–0.075)" });
    }
    return flags;
  }

  /* جدول معاملات الخشونة المرجعية للترع المصرية */
  var N_TABLE = [
    { key: "مبطنة خرسانة ناعمة", n: 0.014 },
    { key: "مبطنة خرسانة عادية", n: 0.017 },
    { key: "ترابية نظيفة حديثة التطهير", n: 0.022 },
    { key: "ترابية بحشائش خفيفة", n: 0.030 },
    { key: "ترابية بحشائش متوسطة", n: 0.040 },
    { key: "ترابية بحشائش كثيفة", n: 0.060 },
    { key: "مجرى طبيعى غير منتظم", n: 0.035 }
  ];

  var API = {
    G: G,
    trapSection: trapSection,
    irregularSection: irregularSection,
    manningQ: manningQ,
    manningV: manningV,
    manningN: manningN,
    conveyance: conveyance,
    normalDepth: normalDepth,
    criticalDepth: criticalDepth,
    froude: froude,
    specificEnergy: specificEnergy,
    gvfProfile: gvfProfile,
    gvfSlope: gvfSlope,
    backwaterClass: backwaterClass,
    gateFlow: gateFlow,
    gateOpeningFor: gateOpeningFor,
    sharpCrestedWeir: sharpCrestedWeir,
    broadCrestedWeir: broadCrestedWeir,
    vNotchWeir: vNotchWeir,
    hydraulicJump: hydraulicJump,
    fitRatingCurve: fitRatingCurve,
    ratingQ: ratingQ,
    waterBalance: waterBalance,
    muskingum: muskingum,
    sanityCheck: sanityCheck,
    N_TABLE: N_TABLE,
    bisect: bisect,
    version: "1.0"
  };

  root.MWRIHyd = API;
  if (typeof module !== "undefined" && module.exports) { module.exports = API; }
})(typeof window !== "undefined" ? window : this);

</script>
<script>
/* =============================================================
   SchemaEngine — محرّك التطبيقات المقادة بمخطط (م. محسن / MWRI)
   بلا backticks · بلا اعتماديات إلزامية · REST مباشر على RTDB
   يُلصق كما هو داخل وسم script فى index.html أحادى الملف
   ============================================================= */
var SchemaEngine = (function () {
  "use strict";

  var CFG = {
    base: "https://ismailia-64500-default-rtdb.europe-west1.firebasedatabase.app",
    appId: "schema-app",
    root: "",
    onStatus: null
  };

  /* ---------------- طبقة القاعدة ---------------- */
  function hintOf(msg) {
    if (msg.indexOf("Failed to fetch") >= 0) return "انقطاع شبكة أو حجب CORS";
    if (msg.indexOf("401") >= 0 || msg.indexOf("403") >= 0 || msg.indexOf("Permission") >= 0) return "صلاحيات القاعدة";
    if (msg.indexOf("400") >= 0) return "صيغة الطلب";
    if (msg.indexOf("404") >= 0) return "المسار غير موجود";
    return "";
  }
  function status(state, txt) { if (CFG.onStatus) CFG.onStatus(state, txt); }

  function req(path, method, body) {
    var opt = { method: method || "GET" };
    if (body !== undefined) {
      opt.headers = { "Content-Type": "application/json" };
      opt.body = JSON.stringify(body);
    }
    status("busy", "مزامنة…");
    return fetch(CFG.base + "/" + path + ".json", opt).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status + " " + r.statusText);
      return r.json();
    }).then(function (j) {
      status("ok", "متصل بقاعدة الوزارة");
      return j;
    }).catch(function (e) {
      var h = hintOf(String(e.message));
      status("err", "خطأ: " + e.message + (h ? " — " + h : ""));
      throw e;
    });
  }
  function stamp(o) { if (o && typeof o === "object") { o.updatedAt = Date.now(); o.src = CFG.appId; } return o; }

  var db = {
    get: function (p) { return req(p); },
    put: function (p, o) { return req(p, "PUT", stamp(o)); },
    patch: function (p, o) { return req(p, "PATCH", stamp(o)); },
    post: function (p, o) { return req(p, "POST", stamp(o)); },
    del: function (p) { return req(p, "DELETE"); }
  };

  /* ---------------- أدوات ---------------- */
  function el(tag, attrs, kids) {
    var e = document.createElement(tag); attrs = attrs || {};
    for (var k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function toArr(x) {
    if (!x) return [];
    if (Object.prototype.toString.call(x) === "[object Array]") return x.filter(function (i) { return !!i; });
    return Object.keys(x).map(function (k) { return x[k]; }).filter(function (i) { return !!i; });
  }
  function uid(p) { return p + "-" + Date.now().toString(36) + Math.floor(Math.random() * 900 + 100).toString(36); }
  function fmt(n) {
    if (n === null || n === undefined || isNaN(n) || !isFinite(n)) return "—";
    return String(Math.round(n * 100) / 100);
  }
  function when(ms) {
    if (!ms) return "—";
    var d = new Date(ms); function p(x) { return (x < 10 ? "0" : "") + x; }
    return p(d.getDate()) + "/" + p(d.getMonth() + 1) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  /* ---------------- محلّل التعبيرات (بديل آمن لـ eval) ---------------- */
  function tokenize(s) {
    var t = [], i = 0, W = /[A-Za-z0-9_\u0600-\u06FF]/;
    while (i < s.length) {
      var c = s.charAt(i);
      if (c === " ") { i++; continue; }
      if ("+-*/(),".indexOf(c) >= 0) { t.push({ k: c }); i++; continue; }
      if ((c >= "0" && c <= "9") || c === ".") {
        var j = i; while (j < s.length && ((s.charAt(j) >= "0" && s.charAt(j) <= "9") || s.charAt(j) === ".")) j++;
        t.push({ k: "num", v: parseFloat(s.slice(i, j)) }); i = j; continue;
      }
      if (W.test(c)) {
        var m = i; while (m < s.length && W.test(s.charAt(m))) m++;
        t.push({ k: "id", v: s.slice(i, m) }); i = m; continue;
      }
      throw new Error("رمز غير مفهوم: " + c);
    }
    return t;
  }
  var AGGS = { sum: 1, avg: 1, count: 1, max: 1, min: 1 };
  function aggregate(fn, field, rows) {
    if (!AGGS[fn]) throw new Error("دالة غير معروفة: " + fn);
    var vals = [];
    rows.forEach(function (r) { var v = parseFloat(r[field]); if (!isNaN(v)) vals.push(v); });
    if (fn === "count") return field ? vals.length : rows.length;
    if (!vals.length) return 0;
    if (fn === "sum") return vals.reduce(function (a, b) { return a + b; }, 0);
    if (fn === "avg") return vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
    if (fn === "max") return Math.max.apply(null, vals);
    return Math.min.apply(null, vals);
  }
  function evalExpr(src, rows) {
    var t = tokenize(src), p = 0;
    function peek() { return t[p]; }
    function eat(k) { if (!t[p] || t[p].k !== k) throw new Error("متوقع " + k); return t[p++]; }
    function factor() {
      var tk = peek();
      if (!tk) throw new Error("تعبير ناقص");
      if (tk.k === "-") { p++; return -factor(); }
      if (tk.k === "num") { p++; return tk.v; }
      if (tk.k === "(") { p++; var v = expr(); eat(")"); return v; }
      if (tk.k === "id") {
        p++; var name = tk.v, arg = "";
        if (peek() && peek().k === "(") {
          p++;
          if (peek() && peek().k === "id") { arg = t[p].v; p++; }
          eat(")");
          return aggregate(name, arg, rows);
        }
        throw new Error("استخدم دالة مثل sum(الحقل)");
      }
      throw new Error("رمز غير متوقع");
    }
    function term() {
      var v = factor();
      while (peek() && (peek().k === "*" || peek().k === "/")) {
        var op = t[p++].k, r = factor();
        v = op === "*" ? v * r : (r === 0 ? NaN : v / r);
      }
      return v;
    }
    function expr() {
      var v = term();
      while (peek() && (peek().k === "+" || peek().k === "-")) {
        var op = t[p++].k, r = term();
        v = op === "+" ? v + r : v - r;
      }
      return v;
    }
    var out = expr();
    if (p < t.length) throw new Error("زوائد بعد نهاية التعبير");
    return out;
  }

  /* ---------------- مصادر البيانات ---------------- */
  /* CSV — محلّل يحترم علامات التنصيص والفواصل داخلها */
  function parseCSV(text) {
    var rows = [], row = [], cur = "", q = false, i = 0;
    while (i < text.length) {
      var c = text.charAt(i);
      if (q) {
        if (c === "\"") {
          if (text.charAt(i + 1) === "\"") { cur += "\""; i += 2; continue; }
          q = false; i++; continue;
        }
        cur += c; i++; continue;
      }
      if (c === "\"") { q = true; i++; continue; }
      if (c === ",") { row.push(cur); cur = ""; i++; continue; }
      if (c === "\n" || c === "\r") {
        if (c === "\r" && text.charAt(i + 1) === "\n") i++;
        row.push(cur); rows.push(row); row = []; cur = ""; i++; continue;
      }
      cur += c; i++;
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(function (r) { return r.join("").trim() !== ""; });
  }

  /* تحويل أى رابط Google Sheet إلى رابط CSV قابل للقراءة عبر المتصفح */
  function sheetCsvUrl(url, sheetName) {
    var m = String(url).match(/\/spreadsheets\/d\/([A-Za-z0-9-_]+)/);
    if (!m) {
      if (String(url).indexOf("output=csv") >= 0 || String(url).indexOf("out:csv") >= 0) return url;
      throw new Error("الرابط ليس رابط Google Sheet");
    }
    var id = m[1];
    var u = "https://docs.google.com/spreadsheets/d/" + id + "/gviz/tq?tqx=out:csv";
    if (sheetName) u += "&sheet=" + encodeURIComponent(sheetName);
    return u;
  }

  function loadSheet(src) {
    var url;
    try { url = sheetCsvUrl(src.url, src.sheet); }
    catch (e) { return Promise.reject(e); }
    status("busy", "قراءة Google Sheet…");
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status + " — الجدول غير منشور على الويب؟");
      return r.text();
    }).then(function (txt) {
      var rows = parseCSV(txt);
      if (!rows.length) throw new Error("الجدول فارغ");
      var head = rows[0], out = [];
      for (var i = 1; i < rows.length; i++) {
        var o = {};
        for (var j = 0; j < head.length; j++) {
          var key = (src.map && src.map[head[j]]) || head[j];
          o[key] = rows[i][j];
        }
        out.push(o);
      }
      status("ok", "قُرئ الجدول — " + out.length + " صف");
      return { head: head, rows: out };
    }).catch(function (e) {
      status("err", "Google Sheet: " + e.message + (hintOf(String(e.message)) ? " — " + hintOf(String(e.message)) : ""));
      throw e;
    });
  }

  function cacheRows(tabId, rows) {

  }
  function loadRecords(tab) {
    var src = tab.source || { type: "firebase" };
    var p;
    if (src.type === "sheet") {
      p = loadSheet(src).then(function (r) {
        return r.rows.map(function (x, i) { x.__key = "s" + i; return x; });
      });
    } else {
      p = db.get(CFG.root + "/data/records/" + tab.id).then(function (o) {
        o = o || {};
        return Object.keys(o).map(function (k) { var r = o[k] || {}; r.__key = k; return r; });
      });
    }
    return p.then(function (rows) {
      cacheRows(tab.id, rows);
      return { rows: rows, offline: false };
    }).catch(function (e) {

      if (c) return { rows: c, offline: true, error: e.message };

  /* ---------------- رسم بيانى SVG بلا مكتبات ---------------- */
  function groupBy(rows, labelField, valueField, agg) {
    var keys = [], map = {};
    rows.forEach(function (r) {

  function svgChart(series, kind, w, h) {
    w = w || 640; h = h || 240;
    var pad = { t: 14, r: 12, b: 34, l: 46 };
    var iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
    var max = 0;
    series.forEach(function (d) { if (d.value > max) max = d.value; });
    if (max <= 0) max = 1;
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("width", "100%");
    svg.setAttribute("style", "display:block;max-height:260px");
    function mk(tag, at) {
      var e = document.createElementNS(ns, tag);
      for (var k in at) e.setAttribute(k, at[k]);
      return e;
    }
    for (var g = 0; g <= 4; g++) {
      var y = pad.t + ih - (ih * g / 4);
      svg.appendChild(mk("line", { x1: pad.l, x2: w - pad.r, y1: y, y2: y, stroke: "#ded6c5", "stroke-width": 1 }));
      var tx = mk("text", { x: pad.l - 6, y: y + 4, "text-anchor": "end", "font-size": 9, fill: "#66736f" });
      tx.textContent = fmt(max * g / 4);
      svg.appendChild(tx);
    }
    var n = series.length || 1, step = iw / n;
    if (kind === "line") {
      var d = "";
      series.forEach(function (s, i) {
        var x = pad.l + step * i + step / 2, y = pad.t + ih - (s.value / max) * ih;
        d += (i === 0 ? "M" : "L") + x + " " + y + " ";
        svg.appendChild(mk("circle", { cx: x, cy: y, r: 3, fill: "#155b75" }));
      });
      svg.appendChild(mk("path", { d: d, fill: "none", stroke: "#247ba0", "stroke-width": 2 }));
    } else {
      series.forEach(function (s, i) {
        var bw = Math.max(6, step * 0.58);
        var x = pad.l + step * i + (step - bw) / 2;
        var bh = (s.value / max) * ih;
        svg.appendChild(mk("rect", { x: x, y: pad.t + ih - bh, width: bw, height: Math.max(1, bh), rx: 4, fill: "#247ba0" }));
      });
    }
    series.forEach(function (s, i) {
      var t = mk("text", {
        x: pad.l + step * i + step / 2, y: h - 12, "text-anchor": "middle",
        "font-size": 9, fill: "#66736f"
      });
      t.textContent = s.label.length > 10 ? s.label.slice(0, 9) + "…" : s.label;
      svg.appendChild(t);
    });
    return svg;
  }

  var HYDRO = {

      name: "مانينج — تصرف وسرعة",
      params: [["b", "عرض القاع (م)"], ["y", "عمق الماء (م)"], ["z", "ميل الجوانب z:1"], ["n", "معامل الخشونة"], ["S", "ميل القاع"]],
      run: function (v) {

        var V = MWRIHyd.manningV(v.n, sec.R, v.S);
        var Fr = MWRIHyd.froude(Q, sec.A, sec.T);
        var yc = MWRIHyd.criticalDepth(Q, v.b, v.z);
        return {
          out: [["التصرف Q", Q, "م³/ث"], ["السرعة V", V, "م/ث"], ["فرود Fr", Fr, ""],
                ["المساحة A", sec.A, "م²"], ["العمق الحرج yc", yc, "م"]],
          main: Q, mainUnit: "م³/ث",
          flags: MWRIHyd.sanityCheck({ V: V, Fr: Fr, n: v.n })

      }

    normalDepth: {

  widgets.forEach(function (w) {
    if (w.type !== "chart" && w.type !== "xchart") return;
    var src = w.type === "xchart" ? (ALL[w.tabId] || { rows: [] }).rows : rows;
    try {
      var series = E.groupBy(src, w.labelField, w.valueField, w.agg || "sum");
      if (!series.length) return;
      box.appendChild(repSection(w.label || "رسم بيانى"));
      box.appendChild(el("div", { "class": "rep-chart" }, [E.svgChart(series, w.chartType || "bar", 700, 250)]));
    } catch (e) { }
  });

  /* الحسابات الهيدروليكية */
  widgets.forEach(function (w) {
    if (w.type !== "hydro" || typeof MWRIHyd === "undefined") return;
    if (w.calc === "balance") {
      try {
        var wb = E.hydroBalance(rows, w.inField, w.outField, { tolerancePct: w.tol || 5 });
        box.appendChild(repSection(w.label || "الاتزان المائى"));
        box.appendChild(repTable(["الوارد (م³/ث)", "المنصرف (م³/ث)", "الفرق (م³/ث)", "نسبة الإقفال %", "الحالة"],
          [[fmt(wb.inflow), fmt(wb.outflow), fmt(wb.closure), fmt(wb.closurePct), wb.status]]));
        box.appendChild(el("p", { "class": "rep-note" }, ["المنهجية: MWRIHyd.waterBalance — سماح " + (w.tol || 5) + "%. لا يشمل البخر والرشح ما لم يُدخَلا كحقول."]));
      } catch (e) { }
      return;
    }
    var def = E.HYDRO[w.calc];
    if (!def) return;
    var head = null, body = [], notes = [];
    rows.forEach(function (r) {
      var v = {}, missing = false;
      def.params.forEach(function (pr) {
        var val = E.hydroValue(w.map, pr[0], r);
        v[pr[0]] = val; if (isNaN(val)) missing = true;
      });
      if (missing) { notes.push(String(r[w.labelField] || "سجل") + ": مدخلات ناقصة — لم يُحسب"); return; }
      var res; try { res = def.run(v); } catch (e) { notes.push(String(r[w.labelField] || "سجل") + ": " + e.message); return; }
      if (!head) {
        head = [w.labelField ? "السجل" : "#"].concat(def.params.map(function (pr) { return pr[0]; }))
          .concat(res.out.map(function (o) { return o[0] + (o[2] ? " (" + o[2] + ")" : ""); })).concat(["الرقابة"]);
      }
      var line = [w.labelField ? String(r[w.labelField] || "—") : "—"];
      def.params.forEach(function (pr) { line.push(fmt(v[pr[0]])); });
      res.out.forEach(function (o) { line.push(o[1] === 0 && o[2] && isNaN(parseFloat(o[2])) ? o[2] : fmt(o[1])); });
      var fl = (res.flags || []).map(function (f) { return f.level + ": " + f.msg; });
      line.push(fl.length ? fl.join(" · ") : "سليم");
      body.push(line);
    });
    if (head) {
      box.appendChild(repSection(w.label || def.name));
      box.appendChild(repTable(head, body));
      box.appendChild(el("p", { "class": "rep-note" }, ["المنهجية: " + def.name + " — النواة الحسابية الموحّدة MWRIHyd. حدود الرقابة: سرعة النحر 2.0 م/ث · الترسيب 0.3 م/ث · معامل الخشونة 0.012–0.075."]));
    }
    if (notes.length) {
      box.appendChild(el("p", { "class": "rep-note" }, ["ملاحظات: " + notes.join(" · ")]));
    }
  });

  /* جداول البيانات */
  if (fields.length && rows.length) {
    var hasTable = false;
    widgets.forEach(function (w) { if (w.type === "table") hasTable = true; });
    if (hasTable) {
      box.appendChild(repSection("بيانات السجلات"));
      box.appendChild(repTable(
        fields.map(function (f) { return f.label + (f.unit ? " (" + f.unit + ")" : ""); }),
        rows.map(function (r) { return fields.map(function (f) { return (r[f.id] === undefined || r[f.id] === "") ? "ــــ" : r[f.id]; }); })
      ));
    }
  }
  if (!rows.length) box.appendChild(el("p", { "class": "rep-note" }, ["لا توجد سجلات مسجّلة فى هذا التبويب حتى تاريخ الاستخراج."]));
  return box;
}

function drawTab(t, rows, offline) {
  var c = document.getElementById("content"); c.innerHTML = "";
  var fields = toArr(t.fields), widgets = toArr(t.widgets);
  EDIT_KEY = null; FORM = null;

  if (offline) {
    c.appendChild(el("div", { "class": "banner warn" }, [
      el("span", { "class": "pill danger" }, ["بلا شبكة"]),
      el("span", {}, ["معروض من آخر نسخة محفوظة على الجهاز — الإدخال والتعديل موقوفان لحد رجوع الشبكة"])
    ]));
  }

  /* شريط تشغيل: أرقام التبويب فى سطر */
  var repBtn = el("button", { "class": "btn mini" }, ["⎙ تقرير هذا التبويب"]);
  repBtn.onclick = function () { reportForTab(t, rows); };
  var repAll = el("button", { "class": "btn mini" }, ["⎙ تقرير شامل"]);
  repAll.onclick = function () { reportForAll(); };
  c.appendChild(el("div", { "class": "ops" }, [
    el("span", {}, [el("b", {}, [String(rows.length)]), " سجل"]),
    el("span", {}, [el("b", {}, [String(fields.length)]), " حقل"]),
    el("span", {}, [el("b", {}, [String(widgets.length)]), " عنصر"]),
    el("span", { "class": "sp" }),
    el("span", { "class": "m" }, ["إصدار المخطط " + (S.schema.version || 1)]),
    repBtn, repAll
  ]));

  if (t.source && t.source.type === "sheet") {
    c.appendChild(el("div", { "class": "banner" }, [
      el("span", { "class": "pill lake" }, ["Google Sheet"]),
      el("span", {}, ["المصدر جدول خارجى — " + rows.length + " صف · القراءة فقط"])
    ]));
  }

  var cards = [];
  widgets.forEach(function (w) {
    if (w.type === "kpi") {
      var v; try { v = E.aggregate(w.agg || "count", w.field || "", rows); } catch (e) { v = NaN; }
      cards.push(kpiCard(w.icon, w.style, w.label, fmt(v), w.unit, (w.agg || "count") + (w.field ? " (" + w.field + ")" : "")));
    } else if (w.type === "xkpi") {
      var src = ALL[w.tabId], xv;
      if (!src) xv = NaN;
      else { try { xv = E.aggregate(w.agg || "count", w.field || "", src.rows); } catch (e) { xv = NaN; } }
      var card = kpiCard(w.icon || "◈", w.style || "", w.label, fmt(xv), w.unit,
        (src ? src.title : "تبويب محذوف") + " · " + (w.agg || "count") + (w.field ? " (" + w.field + ")" : ""));
      if (src) {
        card.style.cursor = "pointer";
        card.onclick = function () { select(w.tabId); };
      }
      cards.push(card);
    } else if (w.type === "formula") {
      var val, sub = w.expr;
      try { val = fmt(E.evalExpr(w.expr, rows)); } catch (e) { val = "خطأ"; sub = e.message; }
      cards.push(kpiCard(w.icon || "ƒ", w.style || "sand", w.label, val, w.unit, sub));
    }
  });
  if (cards.length) {
    var g = el("div", { "class": "grid " + (cards.length >= 4 ? "g4" : (cards.length === 3 ? "g3" : "g2")) });
    cards.forEach(function (x) { g.appendChild(x); });
    c.appendChild(g);
  }

  widgets.forEach(function (w) {
    if (w.type === "note") {
      var p = panel("ملاحظة", w.label || "ملاحظة");
      p.appendChild(el("div", { "class": "hint" }, [w.text || ""]));
      c.appendChild(p); return;
    }
    if (w.type === "chart") {
      var p2 = panel("رسم بيانى", w.label || "رسم");
      try {
        var series = E.groupBy(rows, w.labelField, w.valueField, w.agg || "sum");
        if (!series.length) p2.appendChild(el("div", { "class": "empty" }, ["لا توجد بيانات للرسم."]));
        else p2.appendChild(el("div", { "class": "chart-box" }, [E.svgChart(series, w.chartType || "bar")]));
      } catch (e) { p2.appendChild(el("div", { "class": "empty" }, ["تعذّر الرسم: " + e.message])); }
      c.appendChild(p2); return;
    }
    if (w.type === "map") { c.appendChild(mapPanel(w, rows, t)); return; }
    if (w.type === "hydro") { c.appendChild(hydroPanel(w, rows, t)); return; }
    if (w.type === "overview") { c.appendChild(overviewPanel(w, t)); return; }
    if (w.type === "xchart") { c.appendChild(xchartPanel(w)); return; }
    if (w.type === "activity") { c.appendChild(activityPanel(w)); return; }
    if (w.type === "table") {
      var p3 = panel("جدول", w.label || "السجلات");
      var sBox = el("input", { type: "text", placeholder: "بحث فى السجلات… (اضغط / للانتقال هنا)", "class": "search" });
      sBox.value = FILTER;
      var counter = el("div", { "class": "hint" }, [""]);
      p3.appendChild(el("div", { "class": "fld", style: "margin-top:12px" }, [sBox]));
      p3.appendChild(counter);
      function matched() {
        var q = FILTER.trim().toLowerCase();
        if (!q) return rows;
        return rows.filter(function (r) {
          var hit = false;
          fields.forEach(function (f) {
            if (String(r[f.id] === undefined ? "" : r[f.id]).toLowerCase().indexOf(q) >= 0) hit = true;
          });
          return hit;
        });
      }
      var rowsView = matched();
      if (!rows.length) p3.appendChild(el("div", { "class": "empty" }, ["لا توجد سجلات بعد."]));
      else {
        var tb = el("table"), hr = el("tr");
        fields.forEach(function (f) { hr.appendChild(el("th", {}, [f.label + (f.unit ? " (" + f.unit + ")" : "")])); });
        var editable = !(t.source && t.source.type === "sheet") && !offline;
        if (editable) hr.appendChild(el("th", {}, [""]));
        tb.appendChild(el("thead", {}, [hr]));
        var bd = el("tbody");
        var noHit = el("div", { "class": "empty", style: "display:none" }, ["لا نتائج مطابقة للبحث."]);
        function fillBody() {
          rowsView = matched();
          bd.innerHTML = "";
          counter.textContent = FILTER.trim() ? ("مطابق: " + rowsView.length + " من " + rows.length) : "";
          noHit.style.display = rowsView.length ? "none" : "block";
          buildRows();
        }
        /* البحث يحدّث جسم الجدول فقط — لا يعيد بناء التبويب،
           فلا يفقد مربع البحث تركيزه ولا تُعاد الخرائط والرسوم */
        sBox.oninput = function () { FILTER = sBox.value; fillBody(); };
        function buildRows() {
        rowsView.forEach(function (r) {
          var tr = el("tr");
          fields.forEach(function (f) { tr.appendChild(el("td", {}, [r[f.id] === undefined || r[f.id] === "" ? "—" : String(r[f.id])])); });
          if (editable) {
            var ed = el("button", { "class": "btn mini" }, ["تعديل"]);
            ed.onclick = function () { startEdit(t, r); };
            var del = el("button", { "class": "btn mini warn" }, ["حذف"]);
            del.onclick = function () {
              if (!window.confirm("حذف هذا السجل نهائياً؟")) return;
              E.db.del(E.cfg.root + "/data/records/" + t.id + "/" + r.__key).then(function () {
                audit("حذف سجل من: " + t.title); renderTab(t); toast("اتحذف السجل");
              }).catch(function (e) { toast("فشل الحذف: " + e.message, true); });
            };
            tr.appendChild(el("td", {}, [ed, del]));
          }
          bd.appendChild(tr);
        });
        }
        buildRows();
        tb.appendChild(bd);
        p3.appendChild(el("div", { "class": "tbl-wrap" }, [tb]));
        p3.appendChild(noHit);
        if (FILTER.trim()) counter.textContent = "مطابق: " + rowsView.length + " من " + rows.length;
        var exp = el("button", { "class": "btn mini" }, ["تصدير CSV"]);
        exp.onclick = function () {
          var out = fields.map(function (f) { return f.label; }).join(",") + "\n";
          rowsView.forEach(function (r) {
            out += fields.map(function (f) { return "\u0022" + String(r[f.id] === undefined ? "" : r[f.id]).replace(/"/g, "\u0022\u0022") + "\u0022"; }).join(",") + "\n";
          });
          E.downloadText(t.title + ".csv", out, "text/csv;charset=utf-8");
        };
        p3.appendChild(el("div", { "class": "actions" }, [exp]));
      }
      c.appendChild(p3); return;
    }
  });

  drawForm(t, c, offline);
}

/* ---------------- التحقق من البيانات ---------------- */
function fieldRules(t, f) {
  var r = { required: !!f.required, min: f.min, max: f.max, geo: "" };
  /* نطاق الإحداثيات يُشتقّ من المخطط نفسه: أى حقل مستخدَم كخط عرض/طول
     يُقيَّد تلقائياً، حتى لو نسى المستخدم ضبط حدّيه */
  toArr(t.widgets).forEach(function (w) {
    if (w.type !== "map") return;
    if (w.latField === f.id) { r.min = -90; r.max = 90; r.geo = "خط عرض"; }
    if (w.lngField === f.id) { r.min = -180; r.max = 180; r.geo = "خط طول"; }
  });
  return r;
}
function ruleText(t, f) {
  var r = fieldRules(t, f), bits = [];
  if (r.required) bits.push("إلزامى");
  if (r.min !== undefined && r.min !== "" && r.min !== null) bits.push("أدنى " + r.min);
  if (r.max !== undefined && r.max !== "" && r.max !== null) bits.push("أقصى " + r.max);
  if (r.geo) bits.push(r.geo);
  return bits.join(" · ");
}
function validateRecord(t, rec) {
  var errs = [];
  toArr(t.fields).forEach(function (f) {
    var r = fieldRules(t, f), v = rec[f.id];
    var empty = (v === null || v === undefined || v === "");
    if (r.required && empty) { errs.push({ id: f.id, msg: f.label + ": حقل إلزامى" }); return; }
    if (empty) return;
    if (f.type === "number") {
      var n = parseFloat(v);
      if (isNaN(n)) { errs.push({ id: f.id, msg: f.label + ": القيمة ليست رقماً" }); return; }
      if (r.min !== undefined && r.min !== "" && r.min !== null && n < parseFloat(r.min)) {
        errs.push({ id: f.id, msg: f.label + ": " + n + " أقل من الحد الأدنى " + r.min + (r.geo ? " (" + r.geo + ")" : "") });
      }
      if (r.max !== undefined && r.max !== "" && r.max !== null && n > parseFloat(r.max)) {
        errs.push({ id: f.id, msg: f.label + ": " + n + " أكبر من الحد الأقصى " + r.max + (r.geo ? " (" + r.geo + ")" : "") });
      }
    }
  });
  return errs;
}

function startEdit(t, r) {
  if (!FORM) { toast("نموذج الإدخال غير متاح", true); return; }
  EDIT_KEY = r.__key;
  toArr(t.fields).forEach(function (f) {
    var v = r[f.id];
    FORM.inputs[f.id].value = (v === undefined || v === null) ? "" : v;
  });
  FORM.title.textContent = "تعديل سجل قائم";
  FORM.save.textContent = "حفظ التعديل";
  FORM.cancel.style.display = "inline-flex";
  if (FORM.box.scrollIntoView) FORM.box.scrollIntoView({ behavior: "smooth", block: "center" });
  toast("وضع التعديل — عدّل ثم احفظ");
}
function cancelEdit(t) {
  EDIT_KEY = null;
  if (!FORM) return;
  toArr(t.fields).forEach(function (f) { FORM.inputs[f.id].value = ""; });
  FORM.title.textContent = "إضافة سجل جديد";
  FORM.save.textContent = "حفظ السجل";
  FORM.cancel.style.display = "none";
}

function drawForm(t, c, offline) {
  var fields = toArr(t.fields);
  if (!fields.length) return;
  if (t.source && t.source.type === "sheet") return;
  if (offline) return;
  var fp = panel("إدخال", "إضافة سجل جديد");
  var frm = el("div", { "class": "frm" }), inputs = {};
  fields.forEach(function (f) {
    var inp;
    if (f.type === "select") {
      inp = el("select");
      String(f.options || "").split(",").forEach(function (o) { o = o.trim(); if (o) inp.appendChild(el("option", { value: o }, [o])); });
    } else {
      inp = el("input", { type: (f.type === "number" ? "number" : (f.type === "date" ? "date" : "text")), step: "any" });
    }
    inputs[f.id] = inp;
    var rt = ruleText(t, f);
    frm.appendChild(el("div", { "class": "fld" }, [
      el("label", {}, [f.label + (f.unit ? " (" + f.unit + ")" : "") + (fieldRules(t, f).required ? " *" : "")]),
      inp,
      rt ? el("small", { "class": "rule" }, [rt]) : null
    ]));
  });
  fp.appendChild(frm);
  var errBox = el("div", { "class": "errbox", style: "display:none" });
  fp.appendChild(errBox);
  var save = el("button", { "class": "btn solid" }, ["حفظ السجل"]);
  var cancel = el("button", { "class": "btn", style: "display:none" }, ["إلغاء التعديل"]);
  cancel.onclick = function () { cancelEdit(t); };
  save.onclick = function () {
    var rec = {};
    fields.forEach(function (f) {
      var v = inputs[f.id].value;
      rec[f.id] = f.type === "number" ? (v === "" ? null : parseFloat(v)) : v;
    });
    rec.by = who();
    var errs = validateRecord(t, rec);
    fields.forEach(function (f) { inputs[f.id].classList.remove("bad"); });
    errBox.innerHTML = "";
    if (errs.length) {
      errs.forEach(function (e) {
        if (inputs[e.id]) inputs[e.id].classList.add("bad");
        errBox.appendChild(el("div", {}, ["• " + e.msg]));
      });
      errBox.style.display = "block";
      toast("التحقق منع الحفظ — " + errs.length + " مخالفة", true);
      return;
    }
    errBox.style.display = "none";
    var base = E.cfg.root + "/data/records/" + t.id;
    /* PATCH وقت التعديل: لا يدهس حقلاً أضافه غيرك للسجل نفسه */
    var op = EDIT_KEY ? E.db.patch(base + "/" + EDIT_KEY, rec) : E.db.post(base, rec);
    var wasEdit = !!EDIT_KEY;
    op.then(function () {
      audit((wasEdit ? "تعديل سجل فى: " : "سجل جديد فى: ") + t.title);
      EDIT_KEY = null;
      renderTab(t);
      toast(wasEdit ? "اتحفظ التعديل" : "اتحفظ السجل");
    }).catch(function (e) { toast("فشل الحفظ: " + e.message, true); });
  };
  FORM = { inputs: inputs, save: save, cancel: cancel, box: fp, title: fp.querySelector("h2") };
  fp.appendChild(el("div", { "class": "actions" }, [save, cancel]));
  c.appendChild(fp);
}

/* ---------------- الخريطة ---------------- */
function mapPanel(w, rows, tab) {
  var p = panel("خريطة", w.label || "الموقع");
  var box = el("div", { "class": "map-box", id: "map-" + w.id });
  p.appendChild(box);
  var pts = [];
  rows.forEach(function (r) {
    var la = parseFloat(r[w.latField]), ln = parseFloat(r[w.lngField]);
    if (!isNaN(la) && !isNaN(ln)) pts.push({ la: la, ln: ln, n: String(r[w.labelField] || "نقطة") });
  });
  var acts = el("div", { "class": "actions" });
  var kml = el("button", { "class": "btn mini" }, ["تصدير KML لجوجل إيرث"]);
  kml.onclick = function () {
    if (!pts.length) { toast("لا توجد إحداثيات صالحة", true); return; }
    E.downloadText((w.label || "layer") + ".kml", E.buildKML(rows, w, w.label), "application/vnd.google-earth.kml+xml");
    toast("نزّل الملف وافتحه بجوجل إيرث");
  };
  acts.appendChild(kml);
  if (pts.length) {
    var ge = el("a", { "class": "btn mini", target: "_blank", rel: "noopener", href: E.earthUrl(pts[0].la, pts[0].ln) }, ["افتح الموقع فى جوجل إيرث"]);
    acts.appendChild(ge);
  }
  p.appendChild(acts);
  p.appendChild(el("div", { "class": "hint" }, ["نقاط صالحة: " + pts.length + " من " + rows.length + " سجل"]));

  E.ensureLeaflet(function (err) {
    if (err) { box.innerHTML = ""; box.appendChild(el("div", { "class": "empty" }, [err.message])); return; }
    var base = E.BASEMAPS[w.base || "esri"] || E.BASEMAPS.esri;
    var m = L.map(box.id, { scrollWheelZoom: false });
    L.tileLayer(base.url, { attribution: base.attr, maxZoom: base.max }).addTo(m);
    if (w.gibsProduct && w.gibsDate) {
      L.tileLayer(E.gibsLayer(w.gibsProduct, w.gibsDate), { opacity: 0.75, attribution: "NASA GIBS" }).addTo(m);
    }
    if (pts.length) {
      var g = [];
      pts.forEach(function (pt) { g.push(L.marker([pt.la, pt.ln]).addTo(m).bindPopup(pt.n)); });
      m.fitBounds(L.featureGroup(g).getBounds().pad(0.25));
    } else {
      m.setView([w.lat || 30.0444, w.lng || 31.2357], w.zoom || 10);
    }
    setTimeout(function () { m.invalidateSize(); }, 250);
  });
  return p;
}

/* ---------------- الإدارة ---------------- */
function audit(action) {
  E.db.post(E.cfg.root + "/data/audit", { at: Date.now(), by: who(), action: action }).catch(function () { });
}
function pub(action) {
  E.publish(S, action, who(), function (err, sch) {
    if (err) { toast(err.message, true); return; }
    document.getElementById("st-ver").textContent = "إصدار المخطط " + sch.version;
    buildNav(); select(CUR); toast("تم النشر — إصدار " + sch.version);
  }).catch(function () { /* عولج فى الـcallback — يمنع unhandled rejection */ });
}
/* ---------------- أدوات المخطط: تركيب لوحة القيادة والتصدير والاستيراد ---------------- */
function hasDashboard() {
  var found = false;
  toArr(S.schema.tabs).forEach(function (t) {
    toArr(t.widgets).forEach(function (w) { if (isCross(w)) found = true; });
  });
  return found;
}
function autoDashboard() {
  /* تُبنى من التبويبات الموجودة فعلاً — تعمل على أى تطبيق قائم بمخطط سابق،
     لأن بذرة الملف لا تُطبَّق إلا على قاعدة فارغة */
  var src = toArr(S.schema.tabs);
  if (!src.length) { toast("أنشئ تبويباً واحداً على الأقل أولاً", true); return; }
  var widgets = [];
  src.forEach(function (t) {
    var k = null;
    toArr(t.widgets).forEach(function (w) { if (!k && (w.type === "kpi" || w.type === "formula")) k = w; });
    if (k && k.type === "kpi") {
      widgets.push({
        id: uid("w"), type: "xkpi", label: k.label + " — " + t.title, tabId: t.id,
        agg: k.agg || "count", field: k.field || "", unit: k.unit || "", icon: k.icon || "◈"
      });
    } else {
      widgets.push({
        id: uid("w"), type: "xkpi", label: "عدد سجلات " + t.title, tabId: t.id,
        agg: "count", field: "", unit: "سجل", icon: "#", style: "green"
      });
    }
  });
  widgets.push({ id: uid("w"), type: "overview", label: "حالة كل التبويبات" });
  /* أول تبويب فيه حقل نصى وحقل رقمى يصلح لرسم مجمّع */
  var chartDone = false;
  src.forEach(function (t) {
    if (chartDone) return;
    var txt = null, num = null;
    toArr(t.fields).forEach(function (f) {
      if (!txt && f.type === "text") txt = f.id;
      if (!num && f.type === "number") num = f.id;
    });
    if (txt && num) {
      widgets.push({
        id: uid("w"), type: "xchart", label: "تجميع " + t.title, tabId: t.id,
        labelField: txt, valueField: num, agg: "sum", chartType: "bar"
      });
      chartDone = true;
    }
  });
  widgets.push({ id: uid("w"), type: "activity", label: "آخر الحركات على التطبيق", limit: 8 });
  var tab = {
    id: uid("tab"), icon: "◱", eyebrow: "نظرة المدير", title: "لوحة القيادة",
    source: { type: "firebase" }, fields: [], widgets: widgets
  };
  S.schema.tabs = [tab].concat(src);
  CUR = tab.id;
  pub("تركيب لوحة القيادة تلقائياً");
}
function exportSchema() {
  E.downloadText(APP.id + "-schema-v" + (S.schema.version || 0) + ".json",
    JSON.stringify(S.schema, null, 2), "application/json;charset=utf-8");
  toast("نزّل ملف المخطط");
}
function importSchema(file, done) {
  var fr = new FileReader();
  fr.onload = function () {
    var obj = null;
    try { obj = JSON.parse(fr.result); } catch (e) { toast("الملف ليس JSON سليماً", true); return; }
    if (!obj || !obj.tabs || !toArr(obj.tabs).length) { toast("الملف لا يحوى تبويبات", true); return; }
    if (!window.confirm("استبدال بنية التطبيق الحالية بـ" + toArr(obj.tabs).length + " تبويب من الملف؟\n\nالسجلات لا تُمسّ، والنسخة الحالية تُحفظ فى سجل التغييرات ويمكن الرجوع إليها.")) return;
    S.schema.tabs = toArr(obj.tabs);
    pub("استيراد مخطط من ملف");
    if (done) done();
  };
  fr.onerror = function () { toast("تعذّرت قراءة الملف", true); };
  fr.readAsText(file);
}

/* ---------------- واجهة معالج بناء التبويب ---------------- */
var WIZ = null;   /* {step, ans, preview} */
var TPL_GROUP = "";   /* مرشّح مجال القوالب */
function wizardPanel() {
  var p = panel("معالج", "بناء تبويب بالأسئلة");
  if (!WIZ) {
    p.appendChild(el("div", { "class": "hint" }, [
      "خمسة أسئلة بأزرار، ويولّد لك التبويب كاملاً بحقوله وحدود تحققها ومؤشراته ورسومه — تعاينه قبل التركيب. يعمل بلا إنترنت خارجى وبلا مفاتيح."
    ]));
    var go = el("button", { "class": "btn solid" }, ["ابدأ المعالج"]);
    go.onclick = function () { WIZ = { step: 0, ans: {}, preview: null }; renderAdmin(); };
    p.appendChild(el("div", { "class": "actions" }, [go]));
    return p;
  }

  var steps = E.wizSteps(WIZ.ans);
  /* المعاينة */
  if (WIZ.preview) {
    var t = WIZ.preview;
    p.appendChild(el("div", { "class": "wiz-bar" }, [el("span", {}, ["المعاينة قبل التركيب"])]));
    p.appendChild(el("div", { "class": "adm-row" }, [
      el("span", { "class": "nav-icon" }, [t.icon]),
      el("span", { "class": "t" }, [t.title]),
      el("span", { "class": "m" }, [toArr(t.fields).length + " حقل · " + toArr(t.widgets).length + " عنصر"])
    ]));
    var fl = el("div", { "class": "sub-panel" }, [el("h3", {}, ["الحقول"])]);
    toArr(t.fields).forEach(function (f) {
      var bits = [];
      if (f.required) bits.push("إلزامى");
      if (f.min !== undefined && f.min !== "") bits.push("أدنى " + f.min);
      if (f.max !== undefined && f.max !== "") bits.push("أقصى " + f.max);
      fl.appendChild(el("div", { "class": "adm-row" }, [
        el("span", { "class": "pill lake" }, [f.type]),
        el("span", { "class": "t" }, [f.label]),
        el("span", { "class": "m" }, [f.id + (f.unit ? " · " + f.unit : "") + (bits.length ? " · " + bits.join(" · ") : "")])
      ]));
    });
    p.appendChild(fl);
    var wl = el("div", { "class": "sub-panel" }, [el("h3", {}, ["العناصر"])]);
    toArr(t.widgets).forEach(function (w) {
      wl.appendChild(el("div", { "class": "adm-row" }, [
        el("span", { "class": "pill sand" }, [(E.WIDGETS[w.type] || { name: w.type }).name]),
        el("span", { "class": "t" }, [w.label || "—"])
      ]));
    });
    p.appendChild(wl);
    if (t.notes) p.appendChild(el("div", { "class": "hint" }, ["ملاحظة: " + t.notes]));
    var ok = el("button", { "class": "btn solid" }, ["تركيب التبويب وانشر"]);
    ok.onclick = function () {
      var tab = WIZ.preview;
      delete tab.notes;
      S.schema.tabs = toArr(S.schema.tabs).concat([tab]);
      ADM_TAB = tab.id; WIZ = null;
      pub("تبويب من المعالج: " + tab.title);
    };
    var back = el("button", { "class": "btn" }, ["رجوع للأسئلة"]);
    back.onclick = function () { WIZ.preview = null; WIZ.step = 0; renderAdmin(); };
    var cancel = el("button", { "class": "btn warn" }, ["إلغاء"]);
    cancel.onclick = function () { WIZ = null; renderAdmin(); };
    p.appendChild(el("div", { "class": "actions" }, [ok, back, cancel]));
    return p;
  }

  /* السؤال الحالى */
  var q = steps[WIZ.step];
  if (!q) {
    WIZ.preview = E.wizardTab(WIZ.ans);
    return wizardPanel();
  }
  /* عدد الأسئلة يتحدّد بعد إجابة السؤال الأول (نوع التبويب) — فلا يُعرض قبلها */
  p.appendChild(el("div", { "class": "wiz-bar" }, [
    el("span", {}, [WIZ.ans.kind ? ("سؤال " + (WIZ.step + 1) + " من " + steps.length) : "السؤال الأول"]),
    el("span", { "class": "sp" }),
    el("span", { "class": "m" }, [Object.keys(WIZ.ans).length + " إجابة"])
  ]));
  p.appendChild(el("h2", { "class": "wiz-q" }, [q.q]));

  if (q.type === "text") {
    var inp = el("input", { type: "text", placeholder: q.ph || "", value: WIZ.ans[q.id] || "" });
    var nx = el("button", { "class": "btn solid" }, ["التالى"]);
    nx.onclick = function () {
      if (!inp.value.trim()) { toast("اكتب إجابة أولاً", true); return; }
      WIZ.ans[q.id] = inp.value.trim(); WIZ.step++; renderAdmin();
    };
    p.appendChild(el("div", { "class": "frm" }, [el("div", { "class": "fld" }, [inp])]));
    p.appendChild(el("div", { "class": "actions" }, [nx]));
  } else {
    var wrap = el("div", { "class": "wiz-opts" });
    q.opts.forEach(function (o) {
      var b = el("button", { "class": "wiz-opt" + (WIZ.ans[q.id] === o[0] ? " on" : "") }, [o[1]]);
      b.onclick = function () { WIZ.ans[q.id] = o[0]; WIZ.step++; renderAdmin(); };
      wrap.appendChild(b);
    });
    p.appendChild(wrap);
  }
  var acts = [];
  if (WIZ.step > 0) {
    var bk = el("button", { "class": "btn" }, ["السابق"]);
    bk.onclick = function () { WIZ.step--; renderAdmin(); };
    acts.push(bk);
  }
  var cn = el("button", { "class": "btn warn" }, ["إلغاء المعالج"]);
  cn.onclick = function () { WIZ = null; renderAdmin(); };
  acts.push(cn);
  p.appendChild(el("div", { "class": "actions" }, acts));
  return p;
}

function renderAdmin() {
  var c = document.getElementById("content"); c.innerHTML = "";

  var nameInp = el("input", { type: "text", value: who() === "مستخدم غير مسمّى" ? "" : who(), placeholder: "اكتب اسمك" });
  var nb = el("button", { "class": "btn" }, ["حفظ الاسم"]);
  nb.onclick = function () { localStorage.setItem(APP.id + "_user", nameInp.value || "مستخدم غير مسمّى"); toast("اتسجّل الاسم"); };
  var idp = panel("الهوية", "مين بيعدّل؟");
  idp.appendChild(el("div", { "class": "hint" }, ["الاسم بيتسجّل مع كل تعديل فى سجل التغييرات."]));
  idp.appendChild(el("div", { "class": "frm" }, [el("div", { "class": "fld" }, [el("label", {}, ["اسمك"]), nameInp])]));
  idp.appendChild(el("div", { "class": "actions" }, [nb]));
  c.appendChild(idp);

  var tools = panel("أدوات", "لوحة القيادة والنسخ");
  var dashBtn = el("button", { "class": "btn solid" }, [hasDashboard() ? "إعادة تركيب لوحة القيادة" : "تركيب لوحة القيادة تلقائياً"]);
  dashBtn.onclick = function () {
    if (hasDashboard() && !window.confirm("يوجد بالفعل تبويب فيه عناصر لوحة قيادة. إضافة لوحة جديدة فى المقدمة؟")) return;
    autoDashboard();
  };
  var expBtn = el("button", { "class": "btn" }, ["تصدير المخطط JSON"]);
  expBtn.onclick = exportSchema;
  var impInput = el("input", { type: "file", accept: ".json,application/json", style: "display:none" });
  impInput.onchange = function () { if (impInput.files && impInput.files[0]) importSchema(impInput.files[0]); };
  var impBtn = el("button", { "class": "btn" }, ["استيراد مخطط من ملف"]);
  impBtn.onclick = function () { impInput.click(); };
  tools.appendChild(el("div", { "class": "hint" }, [
    "بذرة التطبيق لا تُطبَّق إلا على قاعدة فارغة — التطبيق القائم يحتفظ بمخططه المنشور. "
    + "لتركيب لوحة قيادة على تطبيق موجود استخدم الزر الأول: يبنيها من تبويباتك الحالية وينشرها كإصدار جديد قابل للتراجع."
  ]));
  tools.appendChild(el("div", { "class": "actions" }, [dashBtn, expBtn, impBtn, impInput]));
  c.appendChild(tools);

  c.appendChild(wizardPanel());

  /* قوالب جاهزة — تُركَّب على المخطط القائم */
  var tplPanel = panel("قوالب جاهزة", "تبويبات أعمال المجارى المائية");
  tplPanel.appendChild(el("div", { "class": "hint" }, [
    "قوالب لكل المجالات: رى وتشغيل · هيدروليك · متابعة أعمال · حصر · موارد بشرية · متابعة إدارية. كل قالب بنية جاهزة بحقولها وحدود تحققها ومؤشراتها ورسومها — بلا أى بيانات. يُضاف كتبويب وينشر إصداراً قابلاً للتراجع، ثم عدّله كما تشاء."
  ]));
  /* القوالب مجمّعة بالمجال، مع مرشّح سريع */
  var groups = [], byGroup = {};
  E.toArr(E.TEMPLATES).forEach(function (tpl) {
    var g = tpl.group || "أخرى";
    if (!byGroup[g]) { byGroup[g] = []; groups.push(g); }
    byGroup[g].push(tpl);
  });
  var chips = el("div", { "class": "chips" });
  var listBox = el("div");
  function drawTpl() {
    listBox.innerHTML = "";
    groups.forEach(function (g) {
      if (TPL_GROUP && TPL_GROUP !== g) return;
      listBox.appendChild(el("div", { "class": "grp-title" }, [g + " (" + byGroup[g].length + ")"]));
      byGroup[g].forEach(function (tpl) {
        var b = el("button", { "class": "btn mini solid" }, ["تركيب"]);
        b.onclick = function () {
          var t = tpl.build();
          S.schema.tabs = toArr(S.schema.tabs).concat([t]);
          ADM_TAB = t.id;
          pub("تركيب قالب: " + tpl.name);
        };
        listBox.appendChild(el("div", { "class": "adm-row" }, [
          el("span", { "class": "pill lake" }, [g]),
          el("span", { "class": "t" }, [tpl.name]),
          el("span", { "class": "m", style: "max-width:100%" }, [tpl.desc]),
          el("span", { "class": "sp" }), b
        ]));
      });
    });
  }
  ["الكل"].concat(groups).forEach(function (g) {
    var val = g === "الكل" ? "" : g;
    var ch = el("button", { "class": "chip" + (TPL_GROUP === val ? " on" : "") }, [g]);
    ch.onclick = function () { TPL_GROUP = val; renderAdmin(); };
    chips.appendChild(ch);
  });
  tplPanel.appendChild(chips);
  tplPanel.appendChild(listBox);
  drawTpl();
  c.appendChild(tplPanel);

  var tp = panel("البنية", "التبويبات الحالية");
  toArr(S.schema.tabs).forEach(function (t) {
    var open = el("button", { "class": "btn mini" }, [ADM_TAB === t.id ? "إغلاق" : "فتح البناء"]);
    open.onclick = function () { ADM_TAB = (ADM_TAB === t.id ? null : t.id); renderAdmin(); };
    var del = el("button", { "class": "btn mini warn" }, ["حذف"]);
    del.onclick = function () {
      var n = (RECS[t.id] || []).length;
      var msg = "حذف تبويب «" + t.title + "» نهائياً؟\n\n";
      msg += "سيختفى عند كل المستخدمين: " + toArr(t.fields).length + " حقل و" + toArr(t.widgets).length + " عنصر.\n";
      msg += n ? ("سجلاته (" + n + " سجل على الأقل) تبقى فى القاعدة لكن بلا واجهة تعرضها.\n") : "";
      msg += "\nيمكن التراجع من «سجل التغييرات».";
      if (!window.confirm(msg)) return;
      S.schema.tabs = toArr(S.schema.tabs).filter(function (x) { return x.id !== t.id; });
      ADM_TAB = null; CUR = "__admin"; pub("حذف تبويب: " + t.title);
    };
    tp.appendChild(el("div", { "class": "adm-row" }, [
      el("span", { "class": "nav-icon" }, [t.icon || "▣"]),
      el("span", { "class": "t" }, [t.title]),
      el("span", { "class": "m" }, [toArr(t.fields).length + " حقل · " + toArr(t.widgets).length + " عنصر · " + ((t.source && t.source.type === "sheet") ? "Google Sheet" : "قاعدة الوزارة")]),
      el("span", { "class": "sp" }), open, del
    ]));
    if (ADM_TAB === t.id) tp.appendChild(tabEditor(t));
  });

  var nt = el("input", { type: "text", placeholder: "مثال: متابعة البوابات" });
  var ni = el("input", { type: "text", placeholder: "رمز مثل ⚑", maxlength: "2" });
  var ne = el("input", { type: "text", placeholder: "سطر صغير فوق العنوان" });
  var add = el("button", { "class": "btn solid" }, ["أضف تبويباً وانشر"]);
  add.onclick = function () {
    if (!nt.value.trim()) { toast("اكتب اسم التبويب", true); return; }
    var t = { id: uid("tab"), icon: ni.value || "▣", eyebrow: ne.value || "قسم", title: nt.value.trim(), fields: [], widgets: [], source: { type: "firebase" } };
    S.schema.tabs = toArr(S.schema.tabs).concat([t]); ADM_TAB = t.id;
    pub("تبويب جديد: " + t.title);
  };
  tp.appendChild(el("div", { "class": "sub-panel" }, [
    el("h3", {}, ["تبويب جديد"]),
    el("div", { "class": "frm" }, [
      el("div", { "class": "fld" }, [el("label", {}, ["العنوان"]), nt]),
      el("div", { "class": "fld" }, [el("label", {}, ["الأيقونة"]), ni]),
      el("div", { "class": "fld" }, [el("label", {}, ["السطر العلوى"]), ne])
    ]),
    el("div", { "class": "actions" }, [add])
  ]));
  c.appendChild(tp);
}

function tabEditor(t) {
  var box = el("div", { "class": "sub-panel" });
  box.appendChild(el("h3", {}, ["بناء تبويب: " + t.title]));

  /* --- مصدر البيانات --- */
  var srcSel = el("select");
  [["firebase", "قاعدة الوزارة (إدخال من التطبيق)"], ["sheet", "Google Sheet (قراءة فقط)"]].forEach(function (o) {
    var op = el("option", { value: o[0] }, [o[1]]);
    if ((t.source && t.source.type) === o[0]) op.setAttribute("selected", "selected");
    srcSel.appendChild(op);
  });
  var shUrl = el("input", { type: "text", placeholder: "الصق رابط الجدول", value: (t.source && t.source.url) || "" });

/* ---------------- التأريخ ---------------- */
function renderHistory() {
  var c = document.getElementById("content"); c.innerHTML = "";
